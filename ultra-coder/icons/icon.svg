<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7"/>
      <stop offset="100%" style="stop-color:#00cec9"/>
    </linearGradient>
    <linearGradient id="lightning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Lightning bolt -->
  <path d="M290 80 L180 250 L250 250 L220 430 L340 230 L265 230 Z" 
        fill="url(#lightning)" 
        stroke="#ffffff" 
        stroke-width="8"
        stroke-linejoin="round"/>
  
  <!-- Code brackets -->
  <text x="80" y="300" font-family="monospace" font-size="120" font-weight="bold" fill="rgba(255,255,255,0.3)">&lt;</text>
  <text x="380" y="300" font-family="monospace" font-size="120" font-weight="bold" fill="rgba(255,255,255,0.3)">&gt;</text>
</svg>
